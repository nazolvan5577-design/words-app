            border-radius: 20px;
            background-color: white;
            color: #7f8c8d;

        }

            border-radius: 6px;
            background-color: white;
            color: #3498db;

            background-color: #3498db;
            color: white;
        }

            text-align: left;
        }

            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 420px;
            text-align: center;
            box-sizing: border-box;
        }

            height: 170px;
            background-color: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 18px;
            color: #2c3e50;
            font-weight: bold;
            line-height: 1.4;
            overflow-y: auto;
        }

            border-color: #3498db;
        }
        .test-box {

        }

            font-weight: bold;
            color: #2c3e50;
            text-align: center;

                <select id="bulk-cat" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
                    <option value="kitchen">Кухня</option>
                    <option value="bedroom">Спальня</option>
                    <option value="hallway">Прихожа</option>
                    <option value="home">Дім</option>
                    <option value="office">Офіс</option>
                    <option value="games">Ігри</option>
                    <option value="household">Побут</option>
                    <option value="electronics">Електроніка</option>
                    <option value="toys">Іграшки</option>
                    <option value="cars">Машини</option>
                    <option value="building">Будова</option>
                    <option value="university">Університет</option>
                    <option value="interview">Інтерв'ю</option>
                    <option value="tv_films">ТБ і фільми</option>
                    <option value="quotes">Цитати/Фільми</option>
                </select>

                <label style="font-size: 12px; color: #555;">Вставте список (формат: Слово - Переклад, кожне з нового рядка):</label>
                <textarea id="bulk-text" rows="6" placeholder="Apple - Яблуко&#10;Banana - Банан" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; resize: vertical;"></textarea>
                
                <button onclick="addBulkWords()" class="action-btn" style="background-color: #27ae60; margin-top: 5px;">Імпортувати весь список</button>
            </div>
        </details>
    </div>

    <!-- Вибір категорій -->
    <div class="category-select-box" id="category-buttons">
        <button class="cat-btn active" onclick="changeCategory('all')">Усі</button>
        <button class="cat-btn" onclick="changeCategory('kitchen')">Кухня</button>
        <button class="cat-btn" onclick="changeCategory('bedroom')">Спальня</button>
        <button class="cat-btn" onclick="changeCategory('hallway')">Прихожа</button>
        <button class="cat-btn" onclick="changeCategory('home')">Дім</button>
        <button class="cat-btn" onclick="changeCategory('office')">Офіс</button>
        <button class="cat-btn" onclick="changeCategory('games')">Ігри</button>
        <button class="cat-btn" onclick="changeCategory('household')">Побут</button>
        <button class="cat-btn" onclick="changeCategory('electronics')">Електроніка</button>
        <button class="cat-btn" onclick="changeCategory('toys')">Іграшки</button>
        <button class="cat-btn" onclick="changeCategory('cars')">Машини</button>
        <button class="cat-btn" onclick="changeCategory('building')">Будова</button>
        <button class="cat-btn" onclick="changeCategory('university')">Університет</button>
        <button class="cat-btn" onclick="changeCategory('interview')">Інтерв'ю</button>

        <button class="cat-btn" onclick="changeCategory('quotes')">Цитати/Фільми</button>
    </div>

    <div class="mode-buttons">
        <button class="mode-btn active" id="btn-cards" onclick="switchMode('cards')">Режим карток</button>
        <button class="mode-btn" id="btn-test" onclick="switchMode('test')">Режим тесту</button>
    </div>

    <div class="container">
        <!-- КАРТКИ -->
        <div id="cards-section">
            <div class="counter" id="card-counter">Картка 1 з 0</div>
            <div class="card" id="flashcard" onclick="flipCard()">
                <span id="card-text">Завантаження...</span>
            </div>
            <div class="nav-buttons">
                <button class="action-btn" onclick="prevCard()">Назад</button>
                <button class="action-btn" onclick="nextCard()">Наступна</button>
            </div>
        </div>

        <!-- ТЕСТ -->

            <div class="counter" id="test-counter">Питання 1 з 0</div>
            <div class="test-word" id="test-question-word">Word</div>
            <div id="options-container"></div>
            <div class="result-message" id="test-result"></div>
            <button class="action-btn" id="next-test-btn" style="width: 100%; margin-top: 10px; display: none;" onclick="nextTestQuestion()">Наступне питання</button>
        </div>
    </div>

        // Завантаження збережених слів із LocalStorage
        const savedWords = localStorage.getItem("customWords");
        if (savedWords) {
            allWords.push(...JSON.parse(savedWords));
        }

        let currentCategory = 'all';
        let currentMode = 'cards';
        let activeWords = [];

        let cardIndex = 0;
        let showingEn = true;

        let testIndex = 0;
        let testScore = 0;
        let answered = false;

        function filterWords() {
            if (currentCategory === 'all') {
                activeWords = [...allWords];
            } else {
                activeWords = allWords.filter(w => w.category === currentCategory);
            }
        }

        function changeCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            filterWords();
            
            if (currentMode === 'cards') {
                cardIndex = 0;
                updateCard();
            } else {
                startTest();
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-cards').classList.toggle('active', mode === 'cards');
            document.getElementById('btn-test').classList.toggle('active', mode === 'test');
            
            if (mode === 'cards') {
                document.getElementById('cards-section').style.display = 'block';
                document.getElementById('test-section').style.display = 'none';
                cardIndex = 0;
                updateCard();
            } else {
                document.getElementById('cards-section').style.display = 'none';
                document.getElementById('test-section').style.display = 'block';
                startTest();
            }
        }

        // --- МАСОВЕ ДОДАВАННЯ СЛІВ УЧИТЕЛЕМ ---
        function addBulkWords() {
            const text = document.getElementById("bulk-text").value.trim();
            const category = document.getElementById("bulk-cat").value;

            if (!text) {
                alert("Будь ласка, вставте список слів!");
                return;
            }

            const lines = text.split("\n");
            let addedCount = 0;
            let customList = JSON.parse(localStorage.getItem("customWords") || "[]");

            lines.forEach(line => {
                // Розділяємо рядок за дефісом (-) або двокрапкою (:)
                let parts = line.split(/[-–:]/);
                if (parts.length >= 2) {
                    let en = parts[0].trim();
                    let ua = parts.slice(1).join(" ").trim(); // на випадок якщо у перекладі є дефіси

                    if (en && ua) {
                        const newEntry = { en: en, ua: ua, category: category };
                        allWords.push(newEntry);
                        customList.push(newEntry);
                        addedCount++;
                    }
                }
            });

            if (addedCount > 0) {
                localStorage.setItem("customWords", JSON.stringify(customList));
                document.getElementById("bulk-text").value = "";
                alert(`Успішно додано нових слів: ${addedCount}!`);
                
                filterWords();
                if (currentMode === 'cards') {
                    updateCard();
                } else {
                    startTest();
                }
            } else {
                alert("Не вдалося розпізнати слова. Перевірте формат: Слово - Переклад (кожне з нового рядка).");
            }
        }

        // --- КАРТКИ ---
        function updateCard() {
            if (activeWords.length === 0) {
                document.getElementById("card-text").textContent = "Немає елементів у цій категорії";
                document.getElementById("card-counter").textContent = "0 з 0";
                return;
            }
            showingEn = true;
            document.getElementById("card-text").textContent = activeWords[cardIndex].en;
            document.getElementById("flashcard").style.backgroundColor = "#ffffff";
            document.getElementById("card-counter").textContent = `Картка ${cardIndex + 1} з ${activeWords.length}`;
        }

        function flipCard() {
            if (activeWords.length === 0) return;
            if (showingEn) {
                document.getElementById("card-text").textContent = activeWords[cardIndex].ua;
                document.getElementById("flashcard").style.backgroundColor = "#e8f8f5";
            } else {
                document.getElementById("card-text").textContent = activeWords[cardIndex].en;
                document.getElementById("flashcard").style.backgroundColor = "#ffffff";
            }
            showingEn = !showingEn;
        }

        function nextCard() {
            if (activeWords.length === 0) return;
            cardIndex = (cardIndex + 1) % activeWords.length;
            updateCard();
        }

        function prevCard() {
            if (activeWords.length === 0) return;
            cardIndex = (cardIndex - 1 + activeWords.length) % activeWords.length;
            updateCard();
        }

        // --- ТЕСТ ЗІ ЗМІШУВАННЯМ ---
        function startTest() {
            testIndex = 0;
            testScore = 0;
            
            if (activeWords.length === 0) {
                document.getElementById("test-section").innerHTML = `
                    <div class="test-word">Немає елементів для тесту у цій категорії!</div>
                `;
                return;
            }

            activeWords.sort(() => Math.random() - 0.5);
            loadTestQuestion();
        }

        function loadTestQuestion() {
            answered = false;
            document.getElementById("test-result").textContent = "";
            document.getElementById("next-test-btn").style.display = "none";
            document.getElementById("test-counter").textContent = `Питання ${testIndex + 1} з ${activeWords.length}`;

            const currentObj = activeWords[testIndex];
            document.getElementById("test-question-word").textContent = currentObj.en;

            let options = [currentObj.ua];
            while (options.length < 4 && options.length < allWords.length) {
                let randomWord = allWords[Math.floor(Math.random() * allWords.length)].ua;
                if (!options.includes(randomWord)) {
                    options.push(randomWord);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById("options-container");
            container.innerHTML = "";

            options.forEach(option => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = option;
                btn.onclick = () => checkAnswer(btn, option, currentObj.ua);
                container.appendChild(btn);
            });
        }

        function checkAnswer(btn, selected, correct) {
            if (answered) return;
            answered = true;

            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(b => {
                if (b.textContent === correct) {
                    b.classList.add("correct");
                }
                if (b.textContent === selected && selected !== correct) {
                    b.classList.add("wrong");
                }
            });

            if (selected === correct) {
                document.getElementById("test-result").textContent = "Правильно! 🎉";
                testScore++;
            } else {
                document.getElementById("test-result").textContent = "Помилка! ❌";
            }

            document.getElementById("next-test-btn").style.display = "block";
        }

        function nextTestQuestion() {
            testIndex++;
            if (testIndex < activeWords.length) {
                loadTestQuestion();
            } else {
                document.getElementById("test-section").innerHTML = `
                    <div class="test-word">Тест завершено! 🎯</div>
                    <div style="font-size: 18px; margin-bottom: 20px; text-align: center;">Твій результат: ${testScore} з ${activeWords.length}</div>
                    <button class="action-btn" style="width: 100%;" onclick="switchMode('test')">Пройти знову</button>
                `;
            }
        }

        filterWords();
        updateCard();
    </script>
