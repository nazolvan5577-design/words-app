<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Англійська платформа: Слова, Завдання та Ігри</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
            box-sizing: border-box;
        }

        /* Інтерактивний фон з сотами */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        h1 {
            color: #ffffff;
            margin: 10px 0 15px 0;
            text-align: center;
            font-size: 24px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .category-select-box {
            margin-bottom: 15px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 750px;
            z-index: 2;
        }

        .cat-btn {
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #444;
            border-radius: 20px;
            background-color: rgba(30, 30, 30, 0.85);
            color: #b0b0b0;
            transition: all 0.2s;
        }

        .cat-btn:hover {
            border-color: #2ecc71;
            color: #fff;
        }

        .cat-btn.active {
            background-color: #27ae60;
            color: white;
            border-color: #27ae60;
            box-shadow: 0 0 10px rgba(39, 174, 96, 0.4);
        }

        .mode-buttons {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 2;
        }

        .mode-btn {
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            border: 2px solid #3498db;
            border-radius: 6px;
            background-color: rgba(30, 30, 30, 0.85);
            color: #3498db;
            font-weight: bold;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background-color: #3498db;
            color: white;
            box-shadow: 0 0 12px rgba(52, 152, 219, 0.4);
        }

        .teacher-panel, .container, .task-board {
            background: rgba(22, 22, 22, 0.92);
            border: 1px solid #333;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            text-align: left;
            z-index: 2;
            margin-bottom: 20px;
        }

        .container {
            text-align: center;
        }

        .task-board {
            border-left: 4px solid #f39c12;
        }

        .task-content {
            font-size: 14px;
            line-height: 1.5;
            color: #ccc;
            white-space: pre-wrap;
            margin-top: 8px;
        }

        .card {
            height: 160px;
            background-color: rgba(30, 30, 30, 0.9);
            border: 2px solid #444;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s, border-color 0.2s;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 18px;
            color: #ffffff;
            font-weight: bold;
            line-height: 1.4;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .card:hover {
            border-color: #3498db;
            background-color: rgba(40, 40, 40, 0.95);
        }

        .test-box, .game-box {
            display: none;
            text-align: left;
        }

        .test-word {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 12px 10px;
            margin-bottom: 10px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: rgba(35, 35, 35, 0.9);
            color: #e0e0e0;
            text-align: left;
            box-sizing: border-box;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .option-btn:hover {
            background-color: rgba(50, 50, 50, 0.9);
            border-color: #3498db;
        }

        .option-btn.correct {
            background-color: #27ae60 !important;
            color: white;
            border-color: #27ae60;
        }

        .option-btn.wrong {
            background-color: #c0392b !important;
            color: white;
            border-color: #c0392b;
        }

        /* Стилі для міні-гри */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .game-card {
            background: rgba(40, 40, 40, 0.9);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            user-select: none;
            transition: all 0.2s;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-card:hover {
            border-color: #f39c12;
            background: rgba(55, 55, 55, 0.95);
        }

        .game-card.selected {
            border-color: #3498db;
            background: rgba(52, 152, 219, 0.3);
        }

        .game-card.matched {
            background: rgba(39, 174, 96, 0.4);
            border-color: #27ae60;
            color: #aaa;
            cursor: default;
            opacity: 0.6;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        button.action-btn {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #3498db;
            color: white;
            transition: background-color 0.2s;
            flex: 1;
        }

        button.action-btn:hover {
            background-color: #2980b9;
        }

        .counter {
            margin-bottom: 15px;
            color: #888;
            font-size: 14px;
        }

        .result-message {
            font-size: 18px;
            font-weight: bold;
            color: #2ecc71;
            text-align: center;
            margin-top: 15px;
            min-height: 25px;
        }

        input, select, textarea {
            width: 100%;
            background-color: #1e1e1e !important;
            color: #fff !important;
            border: 1px solid #444 !important;
            box-sizing: border-box;
            padding: 8px;
            border-radius: 4px;
        }

            .cat-btn { font-size: 11px; padding: 5px 10px; }
            .teacher-panel, .container, .task-board { padding: 15px; }
        }

    <script>
        // Анімація фону з сотами та кольоровими стиками
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const hexRadius = 35;
        const hexHeight = Math.sqrt(3) * hexRadius;
        const hexWidth = 2 * hexRadius;
        
        let mouse = { x: -1000, y: -1000, targetX: -1000, targetY: -1000 };

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = e.clientX;
            mouse.targetY = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.targetX = e.touches[0].clientX;
                mouse.targetY = e.touches[0].clientY;
            }
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#1abc9c'];

        function drawHexagon(x, y, radius, fillColor, strokeColor) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                const hx = x + radius * Math.cos(angle);
                const hy = y + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            if (fillColor) {
                ctx.fillStyle = fillColor;
                ctx.fill();
            }
            if (strokeColor) {
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }

        function animateBg() {
            mouse.x += (mouse.targetX - mouse.x) * 0.1;
            mouse.y += (mouse.targetY - mouse.y) * 0.1;

            ctx.clearRect(0, 0, width, height);

            const horizDist = hexWidth * 3 / 4;
            const vertDist = hexHeight;

            const cols = Math.ceil(width / horizDist) + 2;
            const rows = Math.ceil(height / vertDist) + 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = c * horizDist;
                    const y = r * vertDist + (c % 2 === 0 ? 0 : vertDist / 2);

                    const dx = mouse.x - x;
                    const dy = mouse.y - y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    let offsetX = 0;
                    let offsetY = 0;
                    let isClose = dist < 120;

                    if (isClose) {
                        const force = (120 - dist) / 120;
                        offsetX = -(dx / dist) * force * 15;
                        offsetY = -(dy / dist) * force * 15;
                    }

                    const currentX = x + offsetX;
                    const currentY = y + offsetY;

                    drawHexagon(currentX, currentY, hexRadius - 2, 'rgba(25, 25, 25, 0.7)', isClose ? '#444' : '#222');

                    if (isClose) {
                        for (let i = 0; i < 6; i++) {
                            const angle = (Math.PI / 3) * i;
                            const hx = currentX + (hexRadius - 2) * Math.cos(angle);
                            const hy = currentY + (hexRadius - 2) * Math.sin(angle);
                            
                            if (i % 2 === 0) {
                                ctx.beginPath();
                                ctx.arc(hx, hy, 3, 0, Math.PI * 2);
                                ctx.fillStyle = colors[(r + c + i) % colors.length];
                                ctx.shadowBlur = 8;
                                ctx.shadowColor = ctx.fillStyle;
                                ctx.fill();
                                ctx.shadowBlur = 0;
                            }
                        }
                    }
                }
            }
            requestAnimationFrame(animateBg);
        }
        animateBg();
    </script>

            { en: "Houston, we have a problem.", ua: "Х'юстон, у нас проблема.", category: "quotes" },
            { en: "Carpe diem. Seize the day.", ua: "Лови момент.", category: "quotes" },
            { en: "Keep your friends close, but your enemies closer.", ua: "Тримай друзів близько, а ворогів ближче.", category: "quotes" },
            { en: "Why so serious?", ua: "Чому такі серйозні? (Джокер)", category: "quotes" },
            { en: "Hakuna Matata!", ua: "Без турбот! (Король Лев)", category: "quotes" },
            { en: "Say hello to my little friend!", ua: "Привітайтеся з моїм маленьким другом!", category: "quotes" },
            { en: "The truth is out there.", ua: "Істина десь там.", category: "quotes" },
            { en: "Bazinga!", ua: "Базінга! (Теорія великого вибуху)", category: "quotes" },
            { en: "Not all those who wander are lost.", ua: "Не кожен, хто блукає, заблукав.", category: "quotes" },
            { en: "Yer a wizard, a bit of a standard line.", ua: "Ти чарівник, класична фраза.", category: "quotes" },
            { en: "After all this time? - Always.", ua: "Після стількох років? — Завжди.", category: "quotes" }
        ];

        // Завантаження збережених слів та завдань
        const savedWords = localStorage.getItem("customWords");
        if (savedWords) {
            allWords.push(...JSON.parse(savedWords));
        }

        let currentCategory = 'all';
        let currentMode = 'cards';
        let activeWords = [];

        let cardIndex = 0;
        let showingEn = true;

        let testIndex = 0;
        let testScore = 0;
        let answered = false;

        // Завантаження завдань вчителя
        function loadTeacherTasks() {
            const savedTask = localStorage.getItem("teacherTaskText");
            const taskBox = document.getElementById("display-tasks");
            const taskInput = document.getElementById("teacher-task-input");
            
            if (savedTask) {
                taskBox.textContent = savedTask;
                if(taskInput) taskInput.value = savedTask;
            } else {
                const defaultTask = "1. Вивчіть блок «Неправильні дієслова».\n2. Пройдіть тест або міні-гру.\n3. Підготуйтеся до обговорення нових тем.";
                taskBox.textContent = defaultTask;
                if(taskInput) taskInput.value = defaultTask;
            }
        }

        function saveTeacherTasks() {
            const text = document.getElementById("teacher-task-input").value;
            localStorage.setItem("teacherTaskText", text);
            loadTeacherTasks();
            alert("Завдання успішно оновлено!");
        }

        function filterWords() {
            if (currentCategory === 'all') {
                activeWords = [...allWords];
            } else {
                activeWords = allWords.filter(w => w.category === currentCategory);
            }
        }

        function changeCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            filterWords();
            
            if (currentMode === 'cards') {
                cardIndex = 0;
                updateCard();
            } else if (currentMode === 'test') {
                startTest();
            } else if (currentMode === 'game') {
                startMatchingGame();
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-cards').classList.toggle('active', mode === 'cards');
            document.getElementById('btn-test').classList.toggle('active', mode === 'test');
            document.getElementById('btn-game').classList.toggle('active', mode === 'game');
            
            document.getElementById('cards-section').style.display = (mode === 'cards') ? 'block' : 'none';
            document.getElementById('test-section').style.display = (mode === 'test') ? 'block' : 'none';
            document.getElementById('game-section').style.display = (mode === 'game') ? 'block' : 'none';

            if (mode === 'cards') {
                cardIndex = 0;
                updateCard();
            } else if (mode === 'test') {
                startTest();
            } else if (mode === 'game') {
                startMatchingGame();
            }
        }

        // --- МАСОВЕ ДОДАВАННЯ СЛІВ УЧИТЕЛЕМ ---
        function addBulkWords() {
            const text = document.getElementById("bulk-text").value.trim();
            const category = document.getElementById("bulk-cat").value;

            if (!text) {
                alert("Будь ласка, вставте список слів!");
                return;
            }

            const lines = text.split("\n");
            let addedCount = 0;
            let customList = JSON.parse(localStorage.getItem("customWords") || "[]");

            lines.forEach(line => {
                let parts = line.split(/[-–:]/);
                if (parts.length >= 2) {
                    let en = parts[0].trim();
                    let ua = parts.slice(1).join(" ").trim();

                    if (en && ua) {
                        const newEntry = { en: en, ua: ua, category: category };
                        allWords.push(newEntry);
                        customList.push(newEntry);
                        addedCount++;
                    }
                }
            });

            if (addedCount > 0) {
                localStorage.setItem("customWords", JSON.stringify(customList));
                document.getElementById("bulk-text").value = "";
                alert(`Успішно додано нових слів: ${addedCount}!`);
                
                filterWords();
                if (currentMode === 'cards') updateCard();
                else if (currentMode === 'test') startTest();
                else if (currentMode === 'game') startMatchingGame();
            } else {
                alert("Не вдалося розпізнати слова. Перевірте формат: Слово - Переклад");
            }
        }

        // --- КАРТКИ ---
        function updateCard() {
            if (activeWords.length === 0) {
                document.getElementById("card-text").textContent = "Немає елементів у цій категорії";
                document.getElementById("card-counter").textContent = "0 з 0";
                return;
            }
            showingEn = true;
            document.getElementById("card-text").textContent = activeWords[cardIndex].en;
            document.getElementById("flashcard").style.backgroundColor = "rgba(30, 30, 30, 0.9)";
            document.getElementById("card-counter").textContent = `Картка ${cardIndex + 1} з ${activeWords.length}`;
        }

        function flipCard() {
            if (activeWords.length === 0) return;
            if (showingEn) {
                document.getElementById("card-text").textContent = activeWords[cardIndex].ua;
                document.getElementById("flashcard").style.backgroundColor = "rgba(20, 50, 40, 0.9)";
            } else {
                document.getElementById("card-text").textContent = activeWords[cardIndex].en;
                document.getElementById("flashcard").style.backgroundColor = "rgba(30, 30, 30, 0.9)";
            }
            showingEn = !showingEn;
        }

        function nextCard() {
            if (activeWords.length === 0) return;
            cardIndex = (cardIndex + 1) % activeWords.length;
            updateCard();
        }

        function prevCard() {
            if (activeWords.length === 0) return;
            cardIndex = (cardIndex - 1 + activeWords.length) % activeWords.length;
            updateCard();
        }

        // --- ТЕСТ ЗІ ЗМІШУВАННЯМ ---
        function startTest() {
            testIndex = 0;
            testScore = 0;
            
            if (activeWords.length === 0) {
                document.getElementById("test-section").innerHTML = `
                    <div class="test-word">Немає елементів для тесту у цій категорії!</div>
                `;
                return;
            }

            activeWords.sort(() => Math.random() - 0.5);
            loadTestQuestion();
        }

        function loadTestQuestion() {
            answered = false;
            document.getElementById("test-result").textContent = "";
            document.getElementById("next-test-btn").style.display = "none";
            document.getElementById("test-counter").textContent = `Питання ${testIndex + 1} з ${activeWords.length}`;

            const currentObj = activeWords[testIndex];
            document.getElementById("test-question-word").textContent = currentObj.en;

            let options = [currentObj.ua];
            while (options.length < 4 && options.length < allWords.length) {
                let randomWord = allWords[Math.floor(Math.random() * allWords.length)].ua;
                if (!options.includes(randomWord)) {
                    options.push(randomWord);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById("options-container");
            container.innerHTML = "";

            options.forEach(option => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = option;
                btn.onclick = () => checkAnswer(btn, option, currentObj.ua);
                container.appendChild(btn);
            });
        }

        function checkAnswer(btn, selected, correct) {
            if (answered) return;
            answered = true;

            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(b => {
                if (b.textContent === correct) {
                    b.classList.add("correct");
                }
                if (b.textContent === selected && selected !== correct) {
                    b.classList.add("wrong");
                }
            });

            if (selected === correct) {
                document.getElementById("test-result").textContent = "Правильно! 🎉";
                testScore++;
            } else {
                document.getElementById("test-result").textContent = "Помилка! ❌";
            }

            document.getElementById("next-test-btn").style.display = "block";
        }

        function nextTestQuestion() {
            testIndex++;
            if (testIndex < activeWords.length) {
                loadTestQuestion();
            } else {
                document.getElementById("test-section").innerHTML = `
                    <div class="test-word">Тест завершено! 🎯</div>
                    <div style="font-size: 18px; margin-bottom: 20px; text-align: center;">Твій результат: ${testScore} з ${activeWords.length}</div>
                    <button class="action-btn" style="width: 100%;" onclick="switchMode('test')">Пройти знову</button>
                `;
            }
        }

        // --- МІНІ-ІГРА «ЗНАЙДИ ПАРУ» ---
        let selectedGameCard = null;
        let matchedPairsCount = 0;
        let totalPairsInGame = 0;

        function startMatchingGame() {
            const gridContainer = document.getElementById("game-grid-container");
            const resultMsg = document.getElementById("game-result");
            const restartBtn = document.getElementById("restart-game-btn");
            gridContainer.innerHTML = "";
            resultMsg.textContent = "";
            restartBtn.style.display = "none";
            selectedGameCard = null;
            matchedPairsCount = 0;

            if (activeWords.length < 4) {
                gridContainer.innerHTML = "<div style='grid-column: span 2; text-align:center; color:#888;'>У цій категорії занадто мало слів для гри (потрібно мінімум 4). Виберіть «Усі теми».</div>";
                return;
            }

            // Вибираємо 4 випадкові слова для раунду гри
            let shuffled = [...activeWords].sort(() => Math.random() - 0.5).slice(0, 4);
            totalPairsInGame = shuffled.length;
            document.getElementById("game-counter").textContent = `Знайдіть пари (Залишилось: ${totalPairsInGame})`;

            let items = [];
            shuffled.forEach((item, index) => {
                items.push({ text: item.en, type: 'en', pairId: index });
                items.push({ text: item.ua, type: 'ua', pairId: index });
            });

            items.sort(() => Math.random() - 0.5);

            items.forEach(elem => {
                const card = document.createElement("div");
                card.className = "game-card";
                card.textContent = elem.text;
                card.dataset.pairId = elem.pairId;
                card.dataset.type = elem.type;

                card.onclick = () => handleGameCardClick(card);
                gridContainer.appendChild(card);
            });
        }

        function handleGameCardClick(card) {
            if (card.classList.contains('matched') || card.classList.contains('selected')) return;

            if (!selectedGameCard) {
                selectedGameCard = card;
                card.classList.add('selected');
            } else {
                const firstCard = selectedGameCard;
                const secondCard = card;

                if (firstCard.dataset.pairId === secondCard.dataset.pairId && firstCard.dataset.type !== secondCard.dataset.type) {
                    // Знайшли пару!
                    firstCard.classList.remove('selected');
                    firstCard.classList.add('matched');
                    secondCard.classList.add('matched');
                    selectedGameCard = null;
                    matchedPairsCount++;

                    document.getElementById("game-counter").textContent = `Знайдіть пари (Залишилось: ${totalPairsInGame - matchedPairsCount})`;

                    if (matchedPairsCount === totalPairsInGame) {
                        document.getElementById("game-result").textContent = "Вітаю! Усі пари знайдено! 🏆";
                        document.getElementById("restart-game-btn").style.display = "block";
                    }
                } else {
                    // Помилка
                    secondCard.classList.add('selected');
                    setTimeout(() => {
                        firstCard.classList.remove('selected');
                        secondCard.classList.remove('selected');
                        selectedGameCard = null;
                    }, 500);
                }
            }
        }

        filterWords();
        updateCard();
        loadTeacherTasks();
    </script>

</body>
</html>
